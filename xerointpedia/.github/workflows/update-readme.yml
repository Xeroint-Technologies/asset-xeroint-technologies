name: Auto Update README Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch: # Agar kamu bisa menjalankan action ini secara manual jika mau

permissions:
  contents: write # Memberikan izin agar bot bisa meng-update file README.md

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate README
        run: |
          python -c "
          import os

          # Membaca gambar dari folder saat ini
          valid = ('.png', '.jpg', '.jpeg', '.gif', '.webp')
          images = sorted([f for f in os.listdir('.') if f.lower().endswith(valid)])

          with open('README.md', 'w') as f:
              f.write('# Galeri Foto\n\n')
              for img in images:
                  # Mengabaikan README itu sendiri jika berupa gambar (jika ada)
                  f.write(f'![{img}]({img})\n\n')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto update gallery)
