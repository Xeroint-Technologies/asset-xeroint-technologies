name: Auto Update README Gallery

on:
  push:
    # Memicu action ini jika ada perubahan pada folder xerointpedia
    paths:
      - 'xerointpedia/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate README inside xerointpedia folder
        run: |
          python -c "
          import os

          # Tentukan folder target tempat gambar dan README.md berada
          target_dir = 'xerointpedia'
          
          valid_exts = ('.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg')
          
          # Ambil semua gambar dari folder xerointpedia
          files = os.listdir(target_dir)
          images = sorted([f for f in files if f.lower().endswith(valid_exts)])

          readme_path = os.path.join(target_dir, 'README.md')

          with open(readme_path, 'w', encoding='utf-8') as f:
              f.write('# Galeri Foto\n\n')
              for img in images:
                  # Menggunakan URL encoding agar nama file dengan spasi (contoh: 'LOGO NEW.png') terbaca dengan benar
                  img_encoded = img.replace(' ', '%20')
                  f.write(f'![{img}]({img_encoded})\n\n')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add xerointpedia/README.md
          git diff --quiet && git diff --staged --quiet
